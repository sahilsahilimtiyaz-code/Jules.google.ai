name: mobile-apk

on:
  push:
    paths:
      - 'mobile/**'
      - '.github/workflows/mobile-apk.yml'
  workflow_dispatch:

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Generate Android shell (org octavian.com, name jules)
        working-directory: mobile
        run: |
          # Backup our code so flutter create never overwrites it
          cp -r lib /tmp/jules_lib_backup
          cp pubspec.yaml /tmp/jules_pubspec_backup.yaml
          if [ ! -f android/app/build.gradle ]; then
            flutter create --org octavian.com --project-name jules --platforms android .
          fi
          rm -rf lib
          mv /tmp/jules_lib_backup lib
          # merge deps: keep our pubspec (has all deps)
          cp /tmp/jules_pubspec_backup.yaml pubspec.yaml
          grep -q "octavian.com" android/app/build.gradle && echo "applicationId OK" || (echo "fixing applicationId"; sed -i 's/applicationId .*/applicationId \"octavian.com.jules\"/' android/app/build.gradle)

      - name: Install deps
        working-directory: mobile
        run: flutter pub get

      - name: Analyze (must pass)
        working-directory: mobile
        run: flutter analyze

      - name: Run tests (must pass)
        working-directory: mobile
        run: flutter test

      - name: Build debug APK
        working-directory: mobile
        run: flutter build apk --debug

      - uses: actions/upload-artifact@v4
        with:
          name: jules-debug-apk
          path: mobile/build/app/outputs/flutter-apk/app-debug.apk
