name: mobile-apk

on:
  push:
    paths:
      - 'mobile/**'
      - '.github/workflows/mobile-apk.yml'
  workflow_dispatch:

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Generate Android shell (org octavian.com, name jules)
        working-directory: mobile
        run: |
          # Backup our code so flutter create never overwrites it
          cp -r lib /tmp/jules_lib_backup
          cp pubspec.yaml /tmp/jules_pubspec_backup.yaml
          if [ ! -f android/app/build.gradle ] && [ ! -f android/app/build.gradle.kts ]; then
            flutter create --org octavian.com --project-name jules --platforms android .
          else
            echo "android shell already exists, skipping create"
          fi
          rm -rf lib
          mv /tmp/jules_lib_backup lib
          # keep our pubspec (has all deps)
          cp /tmp/jules_pubspec_backup.yaml pubspec.yaml
          echo "--- checking applicationId (supports Groovy + Kotlin DSL) ---"
          if [ -f android/app/build.gradle.kts ]; then
            grep "applicationId" android/app/build.gradle.kts || echo "no applicationId line (kts)"
            if grep -q "octavian.com" android/app/build.gradle.kts; then
              echo "applicationId OK (kts)"
            else
              echo "WARNING: octavian.com missing in kts, patching if namespace line exists"
              sed -i 's/applicationId.*/applicationId = "octavian.com.jules"/' android/app/build.gradle.kts || true
            fi
          elif [ -f android/app/build.gradle ]; then
            grep "applicationId" android/app/build.gradle || true
            if grep -q "octavian.com" android/app/build.gradle; then
              echo "applicationId OK"
            else
              echo "patching applicationId (groovy)"
              sed -i 's/applicationId .*/applicationId "octavian.com.jules"/' android/app/build.gradle || true
            fi
          else
            echo "WARNING: no android build file found"
            ls -R android || true
          fi
          echo "shell step done"

      - name: Install deps
        working-directory: mobile
        run: flutter pub get

      - name: Analyze (must pass)
        working-directory: mobile
        run: flutter analyze

      - name: Run tests (must pass)
        working-directory: mobile
        run: flutter test

      - name: Build debug APK
        working-directory: mobile
        run: flutter build apk --debug

      - uses: actions/upload-artifact@v4
        with:
          name: jules-debug-apk
          path: mobile/build/app/outputs/flutter-apk/app-debug.apk
