name: Jules Invoke
description: 'Invoke Jules, an AI-powered coding agent, to perform tasks on your codebase.'

branding:
  icon: 'code'
  color: 'purple'

inputs:
  prompt:
    description: 'The prompt to pass to Jules'
    required: true
    type: string
  include_last_commit:
    description: 'Whether to pass content of the last commit'
    type: boolean
    default: false
  include_commit_log:
    description: 'Whether to pass commit history'
    type: boolean
    default: false
  starting_branch:
    description: 'The branch for Jules to start from'
    required: false
    type: string
    default: 'main'
  jules_api_key:
    description: 'The Jules API key to use for authentication'
    required: true
    type: string
  automation_mode:
    description: 'AUTO_CREATE_PR or ASK_FOR_APPROVAL'
    required: false
    type: string
    default: 'AUTO_CREATE_PR'
  require_plan_approval:
    description: 'Require plan approval before execution'
    required: false
    type: boolean
    default: false
  max_prompt_chars:
    description: 'Truncate prompt to this many chars to avoid API limits'
    required: false
    type: string
    default: '12000'

outputs:
  session_name:
    description: 'Created Jules session resource name'
    value: ${{ steps.invoke.outputs.session_name }}

runs:
  using: "composite"
  steps:
    - uses: actions/checkout@v5
      with:
        fetch-depth: 30

    - name: Build powerful prompt
      env:
        USER_PROMPT: ${{ inputs.prompt }}
      shell: bash
      run: |
        set -euo pipefail
        echo "$USER_PROMPT" > prompt_raw.txt
        # Power wrapper: verification contract + guardrails
        cat >> prompt_power.txt <<'EOF'
        You are a senior staff engineer agent.
        PROTOCOL:
        1. Map touched area, write 5-9 step plan.
        2. Minimal diffs (<250 lines), no API breaks, no secrets.
        3. All tests must pass. Re-run relevant suite before PR.
        4. PR body: What changed / How verified / Risk / Follow-ups.
        EOF
        cat prompt_raw.txt >> prompt_power.txt
        echo "" >> prompt_power.txt
        echo "$USER_PROMPT" > prompt.txt
        cat prompt_power.txt >> prompt.txt

    - name: Add last commit context
      if: ${{ inputs.include_last_commit }}
      shell: bash
      run: |
        {
          echo -e '\n\nContent of the latest commit (`git show`):'
          echo '```'
          git show --stat
          git show | head -c 6000
          echo '```'
        } >> prompt.txt

    - name: Add commit log context
      if: ${{ inputs.include_commit_log }}
      shell: bash
      run: |
        {
          echo -e '\n\nLast 20 commits (`git log --stat`):'
          echo '```'
          git log -20 --stat | head -c 8000
          echo '```'
          echo -e '\n\nChanged files vs base:'
          git diff --name-only HEAD~5..HEAD 2>/dev/null | head -50 || true
        } >> prompt.txt

    - name: Assemble payload with validation
      shell: bash
      run: |
        set -euo pipefail
        MAX="${{ inputs.max_prompt_chars }}"
        # truncate to avoid 400s
        PROMPT=$(cat prompt.txt | head -c "$MAX")
        jq -n --arg p "$PROMPT" --arg b "${{ inputs.starting_branch }}" --arg r "${{ github.repository }}" \
          --argjson plan "${{ inputs.require_plan_approval }}" --arg mode "${{ inputs.automation_mode }}" '{
            prompt: $p,
            sourceContext: { source: "sources/github/\($r)", githubRepoContext: { startingBranch: $b } },
            requirePlanApproval: $plan,
            automationMode: $mode
          }' > jules_payload.json
        echo "payload chars: $(wc -c < jules_payload.json)"
        jq empty jules_payload.json

    - name: Invoke Jules with retries
      id: invoke
      shell: bash
      env:
        JULES_KEY: ${{ inputs.jules_api_key }}
      run: |
        set -euo pipefail
        for i in 1 2 3; do
          echo "Attempt $i..."
          HTTP=$(curl -s -o resp.json -w "%{http_code}" 'https://jules.googleapis.com/v1alpha/sessions' \
            -X POST -H "Content-Type: application/json" -H "X-Goog-Api-Key: $JULES_KEY" \
            -d @jules_payload.json || echo "000")
          echo "HTTP $HTTP"
          cat resp.json | head -c 2000; echo
          if [ "$HTTP" -ge 200 ] && [ "$HTTP" -lt 300 ]; then
            NAME=$(jq -r '.name // empty' resp.json)
            echo "session_name=$NAME" >> "$GITHUB_OUTPUT"
            echo "Created: $NAME"
            exit 0
          fi
          sleep $((2 ** i))
        done
        echo "Jules invoke failed after 3 tries"; exit 1
